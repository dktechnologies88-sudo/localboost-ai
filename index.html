<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBoost AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1e293b}
header{background:#111827;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}.logo span{color:#22c55e}
.container{max-width:1100px;margin:auto;padding:30px 20px}
.card,.section{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.number{font-size:30px;font-weight:bold;color:#2563eb}
.label{color:#64748b;margin-top:5px}
input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:7px 0 15px;font-size:15px}
textarea{min-height:110px}
button{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#1d4ed8}
.green{background:#16a34a}.green:hover{background:#15803d}
.orange{color:#f59e0b;font-size:48px;font-weight:bold}
.hidden{display:none}
.result{background:#f8fafc;padding:18px;border-radius:10px;margin-top:15px}
.service{padding:10px;border-bottom:1px solid #eee}
</style>
</head>

<body>

<header>
<div class="logo">LocalBoost <span>AI</span></div>
<div>AI Agent for Local Business Growth</div>
</header>

<div class="container">

<div class="card">
<h2>🚀 LocalBoost AI Dashboard</h2>
<button class="green" onclick="showClientForm()">➕ Add Client</button>
<button onclick="loadDK()">💻 Load DK Technologies</button>
</div>

<div id="clientForm" class="section hidden">
<h2>➕ Add Business Client</h2>

<label>Business Name</label>
<input id="businessName" placeholder="e.g. DK Technologies">

<label>Business Category</label>
<input id="category" placeholder="e.g. Laptop Repair Service">

<label>Location</label>
<input id="location" placeholder="e.g. Garia, Kolkata">

<label>Current Business Description</label>
<textarea id="description" placeholder="Paste current Google Business Profile description"></textarea>

<label>Current Services</label>
<textarea id="services" placeholder="One service per line"></textarea>

<button class="green" onclick="runAudit()">⚡ Run AI Audit</button>
</div>

<div id="dashboard" class="hidden">

<div class="section">
<h1 id="title">Business Dashboard</h1>
<p id="subtitle"></p>
</div>

<div class="grid">
<div class="card"><div class="number" id="score">--</div><div class="label">AI Optimization Score</div></div>
<div class="card"><div class="number" id="problems">--</div><div class="label">Problems Found</div></div>
<div class="card"><div class="number" id="opportunities">--</div><div class="label">Growth Opportunities</div></div>
</div>

<div class="section">
<h2>🔍 AI Audit Results</h2>
<div id="auditResults"></div>
</div>

<div class="section">
<h2>🤖 AI Growth Tools</h2>
<button onclick="generateDescription()">📝 Optimize Description</button>
<button onclick="generateServices()">🛠 Generate Services</button>
<button onclick="generatePosts()">📅 Generate Google Posts</button>
</div>

<div id="output" class="section hidden"></div>

</div>

</div>

<script>

let client = {};

function showClientForm(){
 document.getElementById("clientForm").classList.remove("hidden");
}

function loadDK(){
 document.getElementById("clientForm").classList.remove("hidden");
 document.getElementById("businessName").value="DK Technologies";
 document.getElementById("category").value="Laptop & Computer Repair Service";
 document.getElementById("location").value="Garia, Kolkata";
 document.getElementById("description").value="Computer and laptop repair service centre.";
 document.getElementById("services").value=
`Computer repair
Laptop repair
Mac repair
Network setup
Printer repair
Phone repair
Software
Web design`;
}

function runAudit(){

 const name=document.getElementById("businessName").value || "Your Business";
 const category=document.getElementById("category").value;
 const location=document.getElementById("location").value;
 const description=document.getElementById("description").value;
 const services=document.getElementById("services").value;

 client={name,category,location,description,services};

 localStorage.setItem("localboostClient",JSON.stringify(client));

 let score=55;
 let issues=[];

 if(description.length>100) score+=8;
 else issues.push("Business description is too short.");

 if(location) score+=7;
 else issues.push("Location keyword is missing.");

 if(services.toLowerCase().includes("motherboard")) score+=5;
 else issues.push("Missing high-intent motherboard repair service.");

 if(services.toLowerCase().includes("screen")) score+=5;
 else issues.push("Missing laptop screen replacement service.");

 if(services.toLowerCase().includes("charging")) score+=5;
 else issues.push("Missing charging problem repair service.");

 if(issues.length===0) issues.push("Profile structure looks strong. Focus on reviews and regular Google Posts.");

 document.getElementById("clientForm").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");

 document.getElementById("title").innerHTML="Welcome, "+name+" 👋";
 document.getElementById("subtitle").innerHTML=category+" • "+location;
 document.getElementById("score").innerHTML=score+"/100";
 document.getElementById("problems").innerHTML=issues.length;
 document.getElementById("opportunities").innerHTML="12";

 let html="";
 issues.forEach(i=>html+=`<div class="result">⚠️ ${i}</div>`);
 document.getElementById("auditResults").innerHTML=html;
}

function showOutput(title,content){
 const output=document.getElementById("output");
 output.classList.remove("hidden");
 output.innerHTML=`<h2>${title}</h2><div class="result">${content}</div>
 <button class="green" onclick="copyOutput()">📋 Copy Result</button>`;
}

function copyOutput(){
 const text=document.getElementById("output").innerText;
 navigator.clipboard.writeText(text);
 alert("Copied!");
}

function generateDescription(){
 const name=client.name || "Your Business";
 const location=client.location || "your location";

 showOutput("📝 Optimized Business Description",
 `<strong>${name}</strong> is a trusted laptop and computer repair service in ${location}. We provide professional laptop motherboard repair, screen replacement, keyboard repair, charging issue repair, battery replacement, overheating solutions and computer servicing. Our technicians support HP, Dell, Lenovo, Asus, Acer and other major brands. Get reliable diagnosis, quality repairs and quick service.`);
}

function generateServices(){

 const services=[
 "Laptop Repair Service",
 "Laptop Motherboard Repair",
 "Laptop Screen Replacement",
 "Laptop Keyboard Replacement",
 "Laptop Hinge Repair",
 "Laptop Charging Problem Repair",
 "Laptop Battery Replacement",
 "Laptop Water Damage Repair",
 "Laptop Overheating Repair",
 "Laptop Data Recovery",
 "HP Laptop Repair",
 "Dell Laptop Repair",
 "Lenovo Laptop Repair",
 "Asus Laptop Repair",
 "Acer Laptop Repair"
 ];

 let html="<p><strong>Recommended high-intent services:</strong></p>";
 services.forEach(s=>html+=`<div class="service">✓ ${s}</div>`);

 showOutput("🛠 AI Recommended Services",html);
}

function generatePosts(){

 const posts=[
 "🔧 Laptop running slow? Get professional diagnosis and repair today. Visit us for reliable laptop servicing.",
 "💻 Laptop screen broken? We provide professional laptop screen replacement for major brands.",
 "⚡ Laptop not charging? Our technicians can diagnose charging port, adapter and motherboard issues.",
 "🔥 Laptop overheating? Get cleaning, thermal servicing and cooling issue repair from experts."
 ];

 let html="";
 posts.forEach((p,i)=>html+=`<div class="result"><strong>Google Post ${i+1}</strong><br><br>${p}</div>`);

 showOutput("📅 AI Generated Google Posts",html);
}

window.onload=function(){
 const saved=localStorage.getItem("localboostClient");
 if(saved){
   client=JSON.parse(saved);
 }
}

</script>

</body>
</html>
